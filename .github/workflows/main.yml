name: Stock Alert

on:
  schedule:
    - cron: "0 22 * * *"  # 한국시간 오전 10시
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install yfinance requests

      - name: Run alert
        run: |
          python alert.py
